[tool.poetry]
name = "multimodal-crop-classification-s1-s2"
version = "0.1.0"
description = "Multimodal agricultural crop classification using Sentinel-1 SAR and Sentinel-2 MSI with generative augmentation"
authors = ["Alexandru-Costin Enache <alexenache2020@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
torch = "^2.4.0"
torchvision = "^0.19.0"
torchaudio = "^2.4.0"
rasterio = "^1.3.10"
numpy = "^1.26.4"
pandas = "^2.2.2"
scipy = "^1.14.1"
scikit-learn = "^1.5.1"
pyyaml = "^6.0.2"
matplotlib = "^3.9.2"
tqdm = "^4.66.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
black = "^24.8.0"
flake8 = "^7.1.1"
jupyterlab = "^4.2.4"
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"